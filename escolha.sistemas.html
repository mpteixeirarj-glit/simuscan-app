<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SimuScan - Escolha do Sistema</title>
    <link rel="stylesheet" href="css/escolha.css">
</head>
<body>
    <h1>Escolha os sistemas baseados em interfaces do mercado</h1>

    <div class="systems-container">
        <button data-system="gama" class="action-btn">Gama Healthcare</button>

        <div class="sigma-block">
            <div class="action-btn title-only">Sigma Healthcare</div>
            <div class="sigma-versions">
                <button data-system="oldsigma" class="sub-btn">Old Sigma</button>
                <button data-system="newsigma" class="sub-btn">New Sigma</button>
            </div>
        </div>

        <button data-system="kappa" class="action-btn">Kappa Healthcare</button>
    </div>

    <script src="js/escolha.js"></script>
</body>
</html>
